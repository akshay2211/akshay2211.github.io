  version: "1.0.8"

- name: Paper
  key: Paper
  type: experiment
  lang: Kotlin
  tags: [Kotlin, Jetpack Compose]
  platforms: [android]
  summary: An offline-first Android notes app built in Jetpack Compose with MVVM, DataStore, Room, and Coroutines.
  repo: https://github.com/akshay2211/Paper

- name: NYTimes-Compose
  key: NYTimes-Compose
  type: experiment
  lang: Kotlin
  tags: [Kotlin, Jetpack Compose]
  platforms: [android]
  summary: A minimal, offline-first Android client for the NYTimes Top Stories API — Jetpack Compose, MVVM, Room, and Coil.
