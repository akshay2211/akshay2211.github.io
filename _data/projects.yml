# Single source of truth for the Projects page, homepage "selected work",
# llms.txt, and the SoftwareSourceCode JSON-LD.
#
# Fields:
#   name        display name
#   key         GitHub repo name — joins to _data/stats.yml (stars, last push)
#   type        library | tool | experiment   (library/tool -> "Libraries",
#               experiment -> "Experiments & samples")
#   featured    true to surface on the homepage
#   lang        primary language (drives JSON-LD programmingLanguage)
#   tags        short stack tags, rendered as the card eyebrow
#   platforms   android | ios | web | desktop | cli  (rendered as badges)
#   summary     one-line description
#   repo        canonical repository URL
#   install     copy-pasteable install line (Gradle coord or cargo command)
#   version     current released version (omit if unreleased)
#   post        related blog post permalink (optional)

- name: DrawBox
  key: DrawBox
  type: library
  featured: true
  lang: Kotlin
  tags: [Kotlin Multiplatform, Compose]
  platforms: [android, ios, web, desktop]
  summary: A small drawing library with a pen tool, undo stack, and export — originally Android-only, now running across Android, iOS, Web, and Desktop.
  repo: https://github.com/akshay2211/DrawBox
  install: implementation("io.ak1:drawbox:2.1.0")
  version: "2.1.0"
  post: /blog/2026/06/23/drawbox-goes-multiplatform/

- name: Universal Context Pipeline
  key: universal-context-pipeline
  type: tool
  featured: true
  lang: Rust
  tags: [Rust, MCP]
  platforms: [cli]
  summary: A local-first MCP server that indexes your notes, code, and past Claude chats into one searchable tool — no cloud, no telemetry, single Rust binary.
  repo: https://github.com/akshay2211/universal-context-pipeline
  install: cargo install --git https://github.com/akshay2211/universal-context-pipeline
  version: "0.1.0"
  post: /blog/2026/06/28/ucp-local-mcp-for-claude/

- name: statsvg_rs
  key: statsvg_rs
  type: tool
  featured: true
  lang: Rust
  tags: [Rust, SVG]
  platforms: [cli]
  summary: A GitHub stats card renderer I actually control — one Rust program that produces both a header-heavy profile card and a stripped-down lifetime-stats card, refreshed every six hours.
  repo: https://github.com/akshay2211/statsvg_rs
  install: cargo install --git https://github.com/akshay2211/statsvg_rs
  post: /blog/2026/06/22/statsvg-rs-github-stats-cards/

