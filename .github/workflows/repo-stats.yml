name: Refresh repo stats

# Writes _data/stats.yml (stars, forks, last push) for every repo listed in
# _data/projects.yml. Build-time only — no client-side GitHub API calls, no
# unauthenticated rate-limit exposure. Commits back when numbers change, which
# triggers the Pages rebuild.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          keys=$(grep -E '^\s*key:' _data/projects.yml | sed -E 's/.*key:\s*//' | tr -d '"')
          {
            echo "# Generated by .github/workflows/repo-stats.yml — do not edit by hand."
            echo "# Keyed by GitHub repo name; joins to _data/projects.yml via \`key\`."
            echo "# Refreshed on a schedule so the Projects page shows live stars and a"
            echo "# \"last updated\" maintenance signal with zero client-side JS."
          } > _data/stats.yml
          for key in $keys; do
            json=$(gh api "repos/${{ github.repository_owner }}/$key" 2>/dev/null || echo '{}')
            stars=$(echo "$json" | jq -r '.stargazers_count // 0')
            forks=$(echo "$json" | jq -r '.forks_count // 0')
            pushed=$(echo "$json" | jq -r '.pushed_at // ""')
            {
              echo "$key:"
              echo "  stars: $stars"
              echo "  forks: $forks"
              echo "  pushed_at: \"$pushed\""
            } >> _data/stats.yml
          done
          cat _data/stats.yml

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain _data/stats.yml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/stats.yml
            git commit -m "chore: refresh repo stats"
            git push
          else
            echo "No changes."
          fi
